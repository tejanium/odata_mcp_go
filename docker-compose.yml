# Shared multi-tenant server holding no service credentials; clients send their
# own in request headers. Variables are documented in README, Docker section.
services:
  odata-mcp:
    build: .
    image: odata-mcp:local
    command: >
      --universal
      --multi-tenant
      --transport=streamable-http
      --http-addr=0.0.0.0:8080
      --allow-all-interfaces
      --allow-plain-http
      --allowed-service-urls=${ODATA_ALLOWED_SERVICE_URLS:?set ODATA_ALLOWED_SERVICE_URLS to the service URL prefixes callers may use}
      --hints-file=/app/hints.json
      ${ODATA_MCP_EXTRA_FLAGS:-}
    ports:
      - "127.0.0.1:${ODATA_MCP_PORT:-8080}:8080"
    volumes:
      - ${ODATA_HINTS_FILE:-./hints.json}:/app/hints.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
